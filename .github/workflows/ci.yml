# Quality gates for every change headed to develop or main.
# A red run means don't merge (no branch protection on this private repo; see #5).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, build, check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      # Last, because it queries the live Budget API: a network or API failure here
      # should not hide whether the code itself lints, typechecks and builds.
      - name: Check config against the live Budget API
        run: npm run check
